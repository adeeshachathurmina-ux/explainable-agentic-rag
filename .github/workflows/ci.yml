name: Explainable Agentic RAG CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Core Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn pymupdf chromadb sentence-transformers python-dotenv

      - name: Run Mathematical & Architectural Unit Tests
        run: |
          python -m unittest discover -s tests -v